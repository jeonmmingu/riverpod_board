name: riverpod_board
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.4.9      # Riverpod 상태 관리
  riverpod_annotation: ^2.3.3   # 코드 생성 도구
  freezed_annotation: ^2.4.1    # 불변 객체 생성
  json_annotation: ^4.8.1       # JSON 직렬화
  go_router: ^13.1.0            # 라우팅
  hive: ^2.2.3                  # 로컬 데이터베이스
  hive_flutter: ^1.1.0          # Hive Flutter 지원
  uuid: ^4.2.2                  # 고유 ID 생성
  path_provider: ^2.1.2         # 경로 제공
  intl: ^0.19.0                 # 날짜 포맷팅

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7          # 코드 생성 실행
  freezed: ^2.4.5               # 불변 클래스 생성기
  json_serializable: ^6.7.1     # JSON 직렬화 생성기
  riverpod_generator: ^2.3.9    # Riverpod 코드 생성기
  hive_generator: ^2.0.1        # Hive 어댑터 생성기

flutter:
  uses-material-design: true